name: tracker-runner

on:
  schedule:
    - cron: "*/15 * * * *"   # backup restarter only; the job normally restarts itself
  workflow_dispatch:
    inputs:
      preview:
        description: "Send a sample hatch alert and stop"
        type: boolean
        default: false
      preview_count:
        description: "Preview: how many different pets to test (1-10)"
        type: string
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: tracker-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      STOP_AT: ""
    steps:
      - uses: actions/checkout@v4
      - name: Check stop time
        id: gate
        run: |
          if [ -n "$STOP_AT" ] && [ "$(date -u +%s)" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: "3.12"
      - name: Install browser
        if: steps.gate.outputs.done != 'true'
        run: pip install playwright && playwright install --with-deps chromium
      - name: Run tracker loop
        id: loop
        if: steps.gate.outputs.done != 'true'
        run: python runner.py
        env:
          HATCH_QUERY: ${{ secrets.HATCH_QUERY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FLOWER_WEBHOOK_URL: ${{ secrets.FLOWER_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_COUNT: ${{ inputs.preview_count }}
      - name: Start the next run
        if: ${{ !cancelled() && inputs.preview != true && steps.gate.outputs.done != 'true' && steps.loop.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
