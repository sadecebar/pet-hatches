name: tracker-runner

on:
  schedule:
    - cron: "*/15 * * * *"   # backup restarter only; the job normally restarts itself
  workflow_dispatch:
    inputs:
      preview:
        description: "Send a sample hatch alert and stop"
        type: boolean
        default: false
      recap:
        description: "Post a recap of the last 24 hours now and stop"
        type: boolean
        default: false
      recap_day:
        description: "Repost the recap of one day (YYYY-MM-DD), then keep tracking"
        type: string
        default: ""
      preview_count:
        description: "Preview: how many different pets to test (1-10)"
        type: string
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: tracker-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      STOP_AT: ""
    steps:
      - uses: actions/checkout@v4
      - name: Check stop time
        id: gate
        run: |
          if [ -n "$STOP_AT" ] && [ "$(date -u +%s)" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: "3.12"
      - name: Install browser
        if: steps.gate.outputs.done != 'true'
        run: pip install playwright && playwright install --with-deps chromium
      # hatch log (every hatch with its time, for the daily recap). It lists all accounts, so it is
      # kept in GitHub's private Actions cache, never committed to this public repo.
      - name: Restore hatch log
        if: steps.gate.outputs.done != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/hatch_log.json
          key: hatch-log-${{ github.run_id }}
          restore-keys: hatch-log-
      - name: Seed hatch log (one time, only if there is no saved log yet)
        if: steps.gate.outputs.done != 'true'
        env:
          SEED: ${{ secrets.HATCH_LOG_SEED }}
        run: |
          if [ ! -f data/hatch_log.json ] && [ -n "$SEED" ]; then
            mkdir -p data && echo "$SEED" | base64 -d | gunzip > data/hatch_log.json && echo "hatch log seeded"
          fi
      - name: Run tracker loop
        id: loop
        if: steps.gate.outputs.done != 'true'
        run: python -u runner.py   # -u: log lines appear immediately
        env:
          HATCH_QUERY: ${{ secrets.HATCH_QUERY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FLOWER_WEBHOOK_URL: ${{ secrets.FLOWER_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_COUNT: ${{ inputs.preview_count }}
          RECAP: ${{ inputs.recap }}
          RECAP_DAY: ${{ inputs.recap_day }}
      - name: Save hatch log
        if: ${{ always() && hashFiles('data/hatch_log.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/hatch_log.json
          key: hatch-log-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next run
        if: ${{ !cancelled() && inputs.preview != true && inputs.recap != true && steps.gate.outputs.done != 'true' && steps.loop.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
